# Modified by Sopranoworks: ported from Akka to Apache Pekko and Scala 3.
pekko {
  loglevel = "INFO"
  # CapturingLogger lets ConstructorParametersSpec observe what the IO actors log.
  loggers = ["org.apache.pekko.event.Logging$DefaultLogger", "scredis.util.CapturingLogger"]
  log-dead-letters = off
  
  actor {
    debug {
      # enable function of LoggingReceive, which is to log any received message at
      # DEBUG level
      receive = off
    }
  }
  
}

scredis.global.max-concurrent-requests = 300

# Dispatchers of their own, so that ConstructorParametersSpec can tell by the thread names which
# dispatcher an actor of scredis runs on.
scredis-test-io {
  type = Dispatcher
  executor = "fork-join-executor"
  fork-join-executor {
    parallelism-min = 1
    parallelism-max = 2
  }
}
scredis-test-listener {
  type = Dispatcher
  executor = "fork-join-executor"
  fork-join-executor {
    parallelism-min = 1
    parallelism-max = 2
  }
}
scredis-test-decoder {
  type = Dispatcher
  executor = "fork-join-executor"
  fork-join-executor {
    parallelism-min = 1
    parallelism-max = 2
  }
}
